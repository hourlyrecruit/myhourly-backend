# =============================================================================
# MyHourly backend - AWS stack
# -----------------------------------------------------------------------------

name: myhourly-aws

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: myhourly-backend:aws
    # Fixed name: the deploy pipeline tails the logs of this exact container, so
    # renaming it silently breaks the readiness check.
    container_name: myhourly-backend

    env_file:
      - .env

    environment:
      # application.properties defaults to the `dev` profile, which points at the
      # shared Aiven development database. Pin the profile here so the container
      # can never start against it. Values here override .env.
      SPRING_PROFILES_ACTIVE: aws
      PORT: 8080

    ports:
      # The ALB target group points at this port. Restrict the instance's security
      # group to the load balancer's security group - do not expose 8080 publicly.
      - "8080:8080"

    restart: unless-stopped

    # Let Spring finish in-flight requests and close the Hikari pool before Docker
    # escalates to SIGKILL. Keep this below the ALB/target-group deregistration
    # delay so in-flight requests drain first.
    stop_grace_period: 30s

    # Unbounded json-file logs eventually fill the host's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# There is no `postgres` service: production uses Amazon RDS.
