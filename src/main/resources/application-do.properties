
# ==============================================================================
# PRODUCTION PROFILE   ->   run with SPRING_PROFILES_ACTIVE=prod
#
# Target: DigitalOcean Droplet (app) + DigitalOcean Managed PostgreSQL + DigitalOcean Spaces.
# 
# Loaded on top of application.properties, which supplies spring.application.name,
# spring.profiles.active (SPRING_PROFILES_ACTIVE), server.port (PORT),
# spring.servlet.multipart.* and spring.flyway.baseline-*.
#
# Convention: ${ENV_VAR:default}. A placeholder with NO default is REQUIRED - the
# application refuses to start when it is missing. On the Droplet every value comes
# from /opt/myhourly/backend/.env via docker compose env_file. See DEPLOYMENT.md.
#
# REQUIRED
#   DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, JWT_SECRET,
#   DO_SPACES_BUCKET, DO_SPACES_KEY, DO_SPACES_SECRET,
#   PASSWORD_RESET_FRONTEND_URL, PASSWORD_RESET_EMAIL
# OPTIONAL (defaults supplied below)
#   DO_SPACES_REGION, DO_SPACES_ENDPOINT, DO_SPACES_PUBLIC_URL,
#   ACCESS_TOKEN_EXPIRATION, REFRESH_TOKEN_EXPIRATION, HR_EMAIL,
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD,
#   SMTP_STARTTLS_ENABLE, SMTP_SSL_ENABLE, PASSWORD_RESET_EXPIRATION
# ==============================================================================


# ==============================================================================
# DigitalOcean Managed PostgreSQL
#
# Use the connection string from the database's "Connection Details" panel. Managed
# PostgreSQL requires TLS, so keep ?sslmode=require (or verify-full with the CA cert).
# Example:
#   jdbc:postgresql://db-postgresql-blr1-12345-do-user-123-0.b.db.ondigitalocean.com:25060/defaultdb?sslmode=require
# Trusted sources must allow the Droplet before the connection will succeed.
# ==============================================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Schema is owned by Flyway (src/main/resources/db/migration). 'validate' makes any
# drift between the entities and the database fail loudly at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#=================================================================================

#======================================================================================================

#===========================================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:9000000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}
#============================================================

#======================================================================
hr.email=${HR_EMAIL:hr@company.com}
#==========================================================================

#SMTP
# SMTP_PASSWORD has no default on purpose: mail fails at send time instead of
# blocking startup, and the 5s timeouts below keep that failure bounded.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:hourlyrecruittechlabs@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}

# Connection timeouts (5 seconds) to prevent infinite hanging
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#======================================================================================

# Configure SMTP credentials per environment. The reset URL should point to the frontend reset-password page.
app.password-reset.token-expiration-minutes=${PASSWORD_RESET_EXPIRATION:30}
# Must be the public HTTPS reset page of the frontend or the emailed link is unusable.
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL}
app.password-reset.from=${PASSWORD_RESET_EMAIL}


#=================================================================
# DigitalOcean Spaces (S3-compatible object storage)
#
# The upload/download code still reads the legacy property names b2.*
# (see B2StorageConfig and B2FileStorageServiceImpl) - the prefix is historical
# only. In this profile those keys hold Spaces values:
#
#   property          env var                 value
#   b2.bucket         DO_SPACES_BUCKET        Space (bucket) name
#   b2.region         DO_SPACES_REGION        Spaces region slug, e.g. blr1, nyc3, sgp1
#   b2.endpoint       DO_SPACES_ENDPOINT      https://<region>.digitaloceanspaces.com
#   b2.access-key     DO_SPACES_KEY           Spaces access key
#   b2.secret-key     DO_SPACES_SECRET        Spaces secret key
#
# Notes:
#   * DO_SPACES_KEY / DO_SPACES_SECRET are a Spaces key pair generated under
#     Spaces -> API -> Access Keys. They are NOT a DigitalOcean API token and NOT
#     an AWS IAM key.
#   * The SigV4 signature covers the region, so b2.region must be the Spaces
#     region the bucket actually lives in. The endpoint is derived from it.
#   * b2.endpoint follows b2.region, so changing regions only needs DO_SPACES_REGION.
#     Set DO_SPACES_ENDPOINT only for a CDN or a custom host.
#   * Uploads use path-style addressing (S3Configuration.pathStyleAccessEnabled in
#     code) and presigned downloads use virtual-hosted style; Spaces serves both,
#     so no code change is required. Keep the Space private - Block Public Access
#     stays ON and all downloads go through 15-minute presigned URLs.
#   * Bucket names must be DNS-compatible (lowercase, no underscores) or the
#     virtual-hosted presigned URL cannot resolve.
#   * b2.public-url is not read by any code; it is kept for parity with the CDN URL.
#=================================================================
b2.bucket=${DO_SPACES_BUCKET}
b2.access-key=${DO_SPACES_KEY}
b2.secret-key=${DO_SPACES_SECRET}
b2.region=${DO_SPACES_REGION:blr1}
b2.endpoint=${DO_SPACES_ENDPOINT:https://${DO_SPACES_REGION:blr1}.digitaloceanspaces.com}
b2.public-url=${DO_SPACES_PUBLIC_URL:}
#===================================================================



