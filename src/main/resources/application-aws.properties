# ==============================================================================
# AWS PROFILE   ->   run with SPRING_PROFILES_ACTIVE=aws
#
# Everything this application needs on AWS: RDS for PostgreSQL, SES (SMTP) for
# email, S3 for file storage.
#
# Loaded on top of application.properties, which already supplies:
#   spring.application.name | spring.profiles.active (SPRING_PROFILES_ACTIVE)
#   server.port (PORT)      | spring.servlet.multipart.* (100MB)
#   spring.flyway.baseline-* (schema migrations live in db/migration)
#
# Convention: ${ENV_VAR:default}. A placeholder with NO default is REQUIRED and
# the application refuses to start without it. Put every secret in AWS Secrets
# Manager / SSM Parameter Store and inject it as an environment variable - never
# commit a real value to this file.
#
# REQUIRED
#   DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
#   JWT_SECRET
#   AWS_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# OPTIONAL (defaults are supplied below)
#   AWS_REGION, AWS_S3_REGION, AWS_S3_ENDPOINT, AWS_S3_PUBLIC_URL,
#   SUPER_ADMIN_EMAIL,
#   ACCESS_TOKEN_EXPIRATION, REFRESH_TOKEN_EXPIRATION, HR_EMAIL,
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD,
#   SMTP_STARTTLS_ENABLE, SMTP_SSL_ENABLE,
#   PASSWORD_RESET_EXPIRATION, PASSWORD_RESET_FRONTEND_URL, PASSWORD_RESET_EMAIL
#
# ALB health check: point the target group at /swagger-ui/index.html.
# /actuator/health is whitelisted in SecurityConstants but
# spring-boot-starter-actuator is NOT on the classpath, so it returns 404.
# ==============================================================================


# ==============================================================================
# Amazon RDS for PostgreSQL
#
# Append ?sslmode=require (or verify-full) to the JDBC URL so the connection is
# encrypted regardless of the instance's rds.force_ssl setting.
# Example:
#   jdbc:postgresql://myhourly.xxxx.ap-south-1.rds.amazonaws.com:5432/myhourly?sslmode=require
# Credentials belong in Secrets Manager; the task definition injects them.
# ==============================================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool sized for a single ECS task; raise maximum-pool-size together with the
# task count so the instances still fit inside the RDS max_connections budget.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1


# ==============================================================================
# JPA / Hibernate
# The schema is owned by Flyway (src/main/resources/db/migration). 'validate'
# makes any drift between the entities and the database fail loudly at startup,
# which is what you want on a managed database - never switch this to 'update'.
# ==============================================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# ==============================================================================
# JWT
# JWT_SECRET must be at least 64 random characters. Rotating it invalidates
# every issued access and refresh token, so treat it as a deploy-time secret.
# ==============================================================================

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:9000000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}


# ==============================================================================
# Seeded super admin
# application.properties carries the same fallback; override it per environment.
# ==============================================================================

app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@myhourly.com}


# ==============================================================================
# Amazon SES - SMTP interface (spring-boot-starter-mail / Jakarta Mail)
#
#   * Create SMTP credentials in the SES console. They are generated per region
#     and are NOT your IAM access keys.
#   * Port 587 with STARTTLS. Port 465 needs SMTP_SSL_ENABLE=true instead.
#   * The account must have production access, and every From address must be a
#     verified identity in the same region as SMTP_HOST.
#   * Leaving SMTP_USERNAME / SMTP_PASSWORD empty keeps the app booting; mail
#     then fails at send time, which is bounded by the 5s timeouts below.
# ==============================================================================

hr.email=${HR_EMAIL:hr@company.com}

spring.mail.host=${SMTP_HOST:email-smtp.${AWS_REGION:ap-south-1}.amazonaws.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==============================================================================
# Password reset links
# PASSWORD_RESET_FRONTEND_URL must be the public HTTPS page of the frontend
# (e.g. https://app.yourdomain.com/reset-password) or the emailed link is
# unusable. PASSWORD_RESET_EMAIL must be a verified SES identity.
# ==============================================================================

app.password-reset.token-expiration-minutes=${PASSWORD_RESET_EXPIRATION:30}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
app.password-reset.from=${PASSWORD_RESET_EMAIL:noreply@myhourly.com}


# ==============================================================================
# Amazon S3 - file storage
#
# The code that uploads files and generates presigned download URLs still reads
# the legacy property names b2.* (see B2StorageConfig and
# B2FileStorageServiceImpl); the prefix is historical only. In this profile
# those keys hold plain AWS S3 values and are configured from AWS_* variables:
#
#   property            env var                 value
#   b2.bucket           AWS_S3_BUCKET           bucket name
#   b2.region           AWS_S3_REGION           bucket region, e.g. ap-south-1
#   b2.endpoint         AWS_S3_ENDPOINT         https://s3.<region>.amazonaws.com
#   b2.access-key       AWS_ACCESS_KEY_ID       IAM user with access to the bucket
#   b2.secret-key       AWS_SECRET_ACCESS_KEY   IAM secret
#
# Notes:
#   * AWS_REGION is the single knob: it also defaults b2.region and SMTP_HOST.
#     ECS does not inject it the way Lambda does, so set it explicitly whenever
#     the bucket and SES are not in ap-south-1.
#   * b2.endpoint follows b2.region, so moving regions only needs AWS_S3_REGION;
#     set AWS_S3_ENDPOINT only for a VPC endpoint or a custom host.
#   * The client uses path-style addressing with an explicit endpoint
#     (S3Configuration.builder().pathStyleAccessEnabled(true) in code), which
#     AWS S3 accepts, so no code change is needed to point it at S3.
#   * Downloads use presigned URLs that expire in 15 minutes, so the bucket
#     stays private - Block Public Access should remain ON.
#   * b2.public-url is not read by any code and is kept only for parity with the
#     other profiles.
# ==============================================================================

b2.bucket=${AWS_S3_BUCKET}
b2.access-key=${AWS_ACCESS_KEY_ID}
b2.secret-key=${AWS_SECRET_ACCESS_KEY}
b2.region=${AWS_S3_REGION:${AWS_REGION:ap-south-1}}
b2.endpoint=${AWS_S3_ENDPOINT:https://s3.${AWS_S3_REGION:${AWS_REGION:ap-south-1}}.amazonaws.com}
b2.public-url=${AWS_S3_PUBLIC_URL:}
