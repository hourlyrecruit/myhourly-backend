# ==============================================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool sized for a single ECS task; raise maximum-pool-size together with the
# task count so the instances still fit inside the RDS max_connections budget.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# ==============================================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# ==============================================================================

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:9000000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}


# ==============================================================================

app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@myhourly.com}

# ==============================================================================

hr.email=${HR_EMAIL:hr@company.com}

spring.mail.host=${SMTP_HOST:email-smtp.${AWS_REGION:ap-south-1}.amazonaws.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================

app.password-reset.token-expiration-minutes=${PASSWORD_RESET_EXPIRATION:30}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
app.password-reset.from=${PASSWORD_RESET_EMAIL:noreply@myhourly.com}

# ==============================================================================

aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}

