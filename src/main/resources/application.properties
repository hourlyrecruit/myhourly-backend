spring.application.name=my_hourly

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

springdoc.swagger-ui.tagsSorter=alpha

# -----------------------------------------------
# Flyway schema migrations
# -----------------------------------------------

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# -----------------------------------------------
# Initial SUPER_ADMIN seed properties
# -----------------------------------------------
app.super-admin.username=superadmin
app.super-admin.email=superadmin@myhourly.com
app.super-admin.password=Admin@1234

app.manager.username=anagha
app.manager.email=manager@myhourly.com
app.manager.password=Manager@1234

app.hr.username=harshitha
app.hr.email=Harshitha@gmail.com
app.hr.password=Hr@1234

# -----------------------------------------------
# Month-end leave expiry
# -----------------------------------------------
# When true, the scheduled month-end expiry only logs the plan it would apply
# and leaves every leave balance untouched. Turn it on to audit a run in a real
# environment before letting it deduct leave.
leave.expiry.dry-run=false
