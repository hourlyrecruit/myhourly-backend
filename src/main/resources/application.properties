spring.application.name=my_hourly

spring.profiles.active=prod
server.port=${PORT:8080}

springdoc.swagger-ui.tagsSorter=alpha

# -----------------------------------------------
# Flyway schema migrations
# -----------------------------------------------
# Databases that already existed before Flyway was introduced are baselined at
# version 1 (V1__baseline_schema.sql is marked as applied and skipped). Empty
# schemas run V1 and create everything from scratch.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
