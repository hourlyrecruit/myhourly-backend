<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyHourly — Architecture Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0d14;
      --surface:     #111622;
      --surface2:    #1a2133;
      --border:      #1f2d45;
      --text:        #e2e8f0;
      --muted:       #64748b;

      /* Module palette */
      --c-auth:    #6366f1;
      --c-emp:     #22d3ee;
      --c-att:     #f59e0b;
      --c-leave:   #10b981;
      --c-payroll: #ec4899;
      --c-time:    #8b5cf6;
      --c-notif:   #f97316;
      --c-proj:    #06b6d4;
      --c-perf:    #a3e635;
      --c-cal:     #fb7185;
      --c-hol:     #fbbf24;
      --c-master:  #94a3b8;
      --c-set:     #7dd3fc;
      --c-sec:     #f43f5e;
      --c-common:  #a78bfa;
      --c-audit:   #34d399;
      --c-lookup:  #818cf8;
      --c-seed:    #d1d5db;
      --c-util:    #9ca3af;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #fff;
      flex-shrink: 0;
    }
    .title-block h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .title-block p  { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .stats { display: flex; gap: 20px; }
    .stat  { text-align: center; }
    .stat-val { font-size: 20px; font-weight: 700; color: #6366f1; line-height: 1; }
    .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    .controls { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .btn:hover { background: var(--border); border-color: #6366f1; }
    .btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    /* ── Main layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 12px;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .sidebar h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; padding-left: 4px; }
    .module-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 8px;
      cursor: pointer; font-size: 12px;
      transition: background .12s;
      margin-bottom: 2px;
      user-select: none;
    }
    .module-item:hover { background: var(--surface2); }
    .module-item.active { background: var(--surface2); }
    .module-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .module-count {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .module-item.active .module-count { background: var(--border); }

    /* divider */
    .sb-divider { height: 1px; background: var(--border); margin: 12px 0; }
    .layer-legend { padding: 0 4px; }
    .layer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
    .layer-shape { width: 22px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* ── Canvas area ── */
    .canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      background: radial-gradient(ellipse at 40% 40%, #0f1a2e 0%, #0a0d14 70%);
    }
    #graphCanvas { display: block; width: 100%; height: 100%; cursor: grab; }
    #graphCanvas:active { cursor: grabbing; }

    /* ── Info panel ── */
    .info-panel {
      position: absolute; bottom: 16px; right: 16px;
      width: 260px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 12px;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .info-panel.visible { display: block; }
    .ip-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .ip-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .ip-row:last-child { border-bottom: none; }
    .ip-key { color: var(--muted); }
    .ip-val { font-weight: 500; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .ip-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
    }
    .close-ip { float: right; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
    .close-ip:hover { color: var(--text); }

    /* ── Zoom controls ── */
    .zoom-controls {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .zoom-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .zoom-btn:hover { background: var(--border); border-color: #6366f1; }

    /* ── Tooltip ── */
    #tooltip {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      max-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    #tooltip strong { display: block; font-size: 12px; margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">M</div>
    <div class="title-block">
      <h1>MyHourly — Architecture Graph</h1>
      <p>Spring Boot 4.0 · Java 21 · JPA · JWT · MySQL/PostgreSQL</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val">19</div><div class="stat-lbl">Modules</div></div>
    <div class="stat"><div class="stat-val">25</div><div class="stat-lbl">Controllers</div></div>
    <div class="stat"><div class="stat-val">47</div><div class="stat-lbl">Services</div></div>

  </div>
  <div class="controls">
    <button class="btn active" id="btn-all" onclick="setView('all')">All</button>
    <button class="btn" id="btn-deps" onclick="setView('deps')">Dependencies</button>

  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Modules</h2>
    <div id="moduleList"></div>

    <div class="sb-divider"></div>
    <h2 style="margin-bottom:8px">Layer Legend</h2>
    <div class="layer-legend">
      <div class="layer-row"><div class="layer-shape" style="background:#6366f1;border-radius:50%"></div> Controller / API</div>
      <div class="layer-row"><div class="layer-shape" style="background:#22d3ee"></div> Service / Impl</div>
      <div class="layer-row"><div class="layer-shape" style="background:#10b981;border-radius:2px;transform:rotate(45deg);width:12px;height:12px"></div> Repository</div>
      <div class="layer-row"><div class="layer-shape" style="background:#f59e0b;clip-path:polygon(50% 0%,100% 100%,0% 100%)"></div> Entity</div>
      <div class="layer-row"><div class="layer-shape" style="background:#ec4899;border-radius:8px"></div> Config / Common</div>
    </div>
  </aside>

  <!-- Graph -->
  <div class="canvas-wrap">
    <canvas id="graphCanvas"></canvas>

    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(1.2)">+</button>
      <button class="zoom-btn" onclick="zoom(0.8)">−</button>
      <button class="zoom-btn" style="font-size:13px" onclick="resetView()">⟲</button>
    </div>

    <!-- Tooltip -->
    <div id="tooltip"><strong></strong><span></span></div>

    <!-- Info Panel -->
    <div class="info-panel" id="infoPanel">
      <span class="close-ip" onclick="closeInfo()">✕</span>
      <div class="ip-title" id="ipTitle"></div>
      <div id="ipBody"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   DATA MODEL
═══════════════════════════════════════ */
const MODULES = [

  },

    layers: { controller: 1, service: 2, repository: 1, entity: 3, mapper: 1 },
    entities: ['Employee', 'EmploymentType', 'Gender'],
    endpoints: ['/api/employees/**'],

  },

    layers: { controller: 1, service: 2, repository: 2, entity: 5, mapper: 1, scheduler: 1, specification: 1 },
    entities: ['Attendance', 'AttendanceBreak', 'AttendanceStatus', 'BreakType', 'EmployeeStatus'],
    endpoints: ['/api/attendance/**'],

  },
  {
    id: 'leave', name: 'Leave', color: '#10b981', icon: '🌴',
    layers: { controller: 5, service: 5, repository: 4, entity: 5, mapper: 1, scheduler: 1 },
    entities: ['LeaveRequest', 'LeaveBalance', 'LeaveType', 'LeaveApproval', 'LeaveTransaction'],
    endpoints: ['/api/leave-requests/**', '/api/leave-types/**', '/api/leave-balances/**'],
    deps: ['employee', 'attendance', 'notification', 'common', 'settings']
  },
  {
    id: 'payroll', name: 'Payroll', color: '#ec4899', icon: '💰',
    layers: { controller: 3, entity: 2 },
    entities: ['Payroll', 'Salary'],
    endpoints: ['/api/payroll/**', '/api/payslips/**', '/api/salaries/**'],
    deps: ['employee', 'common']
  },
  {
    id: 'timesheet', name: 'Timesheet', color: '#8b5cf6', icon: '📋',
    layers: { controller: 1, entity: 3 },
    entities: ['Timesheet', 'TimesheetEntry', 'TimesheetApproval'],
    endpoints: ['/api/timesheets/**'],
    deps: ['employee', 'project', 'common']
  },
  {
    id: 'notification', name: 'Notification', color: '#f97316', icon: '🔔',
    layers: { controller: 1, service: 1, repository: 1, entity: 1, scheduler: 1, mapper: 1 },
    entities: ['Notification'],
    endpoints: ['/api/notifications/**'],
    deps: ['employee', 'common']
  },
  {
    id: 'project', name: 'Project', color: '#06b6d4', icon: '🏗️',
    layers: { controller: 2, service: 0, entity: 0 },
    entities: [],
    endpoints: ['/api/projects/**', '/api/clients/**'],
    deps: ['employee', 'common']
  },
  {
    id: 'performance', name: 'Performance', color: '#a3e635', icon: '📈',
    layers: { controller: 1, entity: 0 },
    entities: [],
    endpoints: ['/api/performance/**'],
    deps: ['employee', 'common']
  },
  {
    id: 'calendar', name: 'Calendar', color: '#fb7185', icon: '📅',
    layers: { controller: 1, service: 2, entity: 0 },
    entities: ['CalendarEventType', 'CalendarView'],
    endpoints: ['/api/calendar/**'],
    deps: ['attendance', 'leave', 'holiday', 'employee']
  },
  {
    id: 'holiday', name: 'Holiday', color: '#fbbf24', icon: '🎉',
    layers: { controller: 1, service: 2, repository: 1, entity: 1, mapper: 1 },
    entities: ['Holiday'],
    endpoints: ['/api/holidays/**'],
    deps: ['common']
  },
  {
    id: 'master', name: 'Master Data', color: '#94a3b8', icon: '📦',
    layers: { controller: 3, service: 3, repository: 3, entity: 3, mapper: 1 },
    entities: ['Department', 'Designation', 'JobTitle'],
    endpoints: ['/api/departments/**', '/api/designations/**', '/api/job-titles/**'],
    deps: ['common']
  },
  {
    id: 'settings', name: 'Settings', color: '#7dd3fc', icon: '⚙️',
    layers: { controller: 1, service: 4, repository: 4, entity: 4, mapper: 4 },
    entities: ['AttendanceSettings', 'CompanySettings', 'LeaveSettings', 'NotificationSettings', 'WorkLogSettings'],
    endpoints: ['/api/settings/**'],
    deps: ['common']
  },
  {
    id: 'security', name: 'Security', color: '#f43f5e', icon: '🛡️',
    layers: { config: 2, handler: 2, token: 4, user: 2, util: 1 },
    entities: ['JwtService', 'CustomUserDetails', 'SecurityConfig', 'WebConfig'],
    endpoints: [],
    deps: ['auth', 'common']
  },
  {
    id: 'common', name: 'Common', color: '#a78bfa', icon: '🔧',
    layers: { config: 2, constants: 1, entity: 1, enums: 2, exception: 8, payload: 3 },
    entities: ['BaseEntity', 'ApiResponse', 'PageResponse', 'ErrorCode', 'GlobalExceptionHandler'],
    endpoints: [],
    deps: []
  },
  {
    id: 'audit', name: 'Audit', color: '#34d399', icon: '📝',
    layers: { entity: 1, service: 1 },
    entities: ['AuditLog'],
    endpoints: [],
    deps: ['common']
  },
  {
    id: 'lookup', name: 'Lookup', color: '#818cf8', icon: '🔍',
    layers: { controller: 1 },
    entities: [],
    endpoints: ['/api/lookup/**'],
    deps: ['common', 'master', 'employee']
  },
  {
    id: 'seed', name: 'Seed', color: '#d1d5db', icon: '🌱',
    layers: { config: 3, seeders: 8 },
    entities: ['SeedRunner', 'CsvReader'],
    endpoints: [],
    deps: ['employee', 'leave', 'master', 'holiday', 'attendance']
  },
  {
    id: 'util', name: 'Util', color: '#9ca3af', icon: '🛠️',
    layers: { util: 3 },
    entities: ['SecurityUtils', 'StringUtils', 'ValidationUtils'],
    endpoints: [],
    deps: ['common']
  },
];

/* Build edges from deps */
const EDGES = [];
MODULES.forEach(m => {
  m.deps.forEach(d => {
    EDGES.push({ from: m.id, to: d, type: 'depends' });
  });
});

/* ═══════════════════════════════════════
   GRAPH STATE
═══════════════════════════════════════ */
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');
let W, H;
let transform = { x: 0, y: 0, scale: 1 };
let nodes = [], edges = [];
let dragNode = null, dragStart = null, panStart = null;
let hoveredNode = null, selectedNode = null;
let viewMode = 'all';
let activeModule = null;

/* Node radii based on importance */
const BASE_R = 38;

function buildNodes() {
  nodes = MODULES.map((m, i) => {
    const fileCount = Object.values(m.layers).reduce((a, b) => a + b, 0);
    const r = BASE_R + Math.min(fileCount * 1.2, 24);
    return {
      ...m, r,
      x: W / 2 + Math.cos((i / MODULES.length) * Math.PI * 2) * Math.min(W, H) * 0.34,
      y: H / 2 + Math.sin((i / MODULES.length) * Math.PI * 2) * Math.min(W, H) * 0.34,
      vx: 0, vy: 0,
      fx: null, fy: null,
    };
  });
  edges = EDGES.map(e => ({
    ...e,
    source: nodes.find(n => n.id === e.from),
    target: nodes.find(n => n.id === e.to),
  }));
}

/* ═══════════════════════════════════════
   FORCE SIMULATION
═══════════════════════════════════════ */
let simRunning = true;
const CHARGE = -2800;
const LINK_DIST = 180;
const LINK_STRENGTH = 0.08;
const CENTER_STRENGTH = 0.012;
const DAMPING = 0.84;

function simulate() {
  if (!simRunning) return;
  nodes.forEach(n => {
    if (n.fx !== null) { n.x = n.fx; n.y = n.fy; return; }
    // center
    n.vx += (W / 2 - n.x) * CENTER_STRENGTH;
    n.vy += (H / 2 - n.y) * CENTER_STRENGTH;
  });

  // repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist2 = dx * dx + dy * dy + 1;
      const dist = Math.sqrt(dist2);
      const force = CHARGE / dist2;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      if (a.fx === null) { a.vx += fx; a.vy += fy; }
      if (b.fx === null) { b.vx -= fx; b.vy -= fy; }
    }
  }

  // attraction
  edges.forEach(e => {
    const s = e.source, t = e.target;
    if (!s || !t) return;
    let dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (dist - LINK_DIST) * LINK_STRENGTH;
    const fx = (dx / dist) * f, fy = (dy / dist) * f;
    if (s.fx === null) { s.vx += fx; s.vy += fy; }
    if (t.fx === null) { t.vx -= fx; t.vy -= fy; }
  });

  // boundary bounce
  nodes.forEach(n => {
    if (n.fx !== null) return;
    n.vx *= DAMPING; n.vy *= DAMPING;
    n.x += n.vx; n.y += n.vy;
    const pad = n.r + 10;
    if (n.x < pad) { n.x = pad; n.vx *= -0.5; }
    if (n.x > W - pad) { n.x = W - pad; n.vx *= -0.5; }
    if (n.y < pad) { n.y = pad; n.vy *= -0.5; }
    if (n.y > H - pad) { n.y = H - pad; n.vy *= -0.5; }
  });
}

/* ═══════════════════════════════════════
   DRAW
═══════════════════════════════════════ */
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function drawEdge(e) {
  const s = e.source, t = e.target;
  if (!s || !t) return;

  const isActive = activeModule
    ? (s.id === activeModule || t.id === activeModule)
    : true;
  const isSelected = selectedNode
    ? (s.id === selectedNode.id || t.id === selectedNode.id)
    : false;

  const alpha = activeModule
    ? (isActive ? 0.7 : 0.05)
    : (selectedNode ? (isSelected ? 0.8 : 0.08) : 0.28);

  const dx = t.x - s.x, dy = t.y - s.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const sr = s.r, tr = t.r;
  const sx = s.x + (dx/dist)*sr, sy = s.y + (dy/dist)*sr;
  const ex = t.x - (dx/dist)*tr, ey = t.y - (dy/dist)*tr;

  // curve
  const mx = (sx + ex) / 2 - dy * 0.15;
  const my = (sy + ey) / 2 + dx * 0.15;

  const grad = ctx.createLinearGradient(sx, sy, ex, ey);
  grad.addColorStop(0, `rgba(${hexToRgb(s.color)},${alpha})`);
  grad.addColorStop(1, `rgba(${hexToRgb(t.color)},${alpha * 0.6})`);

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo(mx, my, ex, ey);
  ctx.strokeStyle = grad;
  ctx.lineWidth = isSelected || isActive ? 2.2 : 1.2;
  ctx.stroke();

  // arrowhead
  if (alpha > 0.15) {
    const angle = Math.atan2(ey - my, ex - mx);
    const aSize = 7;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - Math.cos(angle - 0.4)*aSize, ey - Math.sin(angle - 0.4)*aSize);
    ctx.lineTo(ex - Math.cos(angle + 0.4)*aSize, ey - Math.sin(angle + 0.4)*aSize);
    ctx.closePath();
    ctx.fillStyle = `rgba(${hexToRgb(t.color)},${alpha})`;
    ctx.fill();
  }
}

function drawNode(n) {
  const isHovered = n === hoveredNode;
  const isSelected = n === selectedNode;
  const isActive = activeModule ? n.id === activeModule : false;
  const isDimmed = activeModule ? (n.id !== activeModule && !n.deps.includes(activeModule) && !MODULES.find(m=>m.id===activeModule)?.deps.includes(n.id)) : false;

  const alpha = isDimmed ? 0.2 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  // glow
  if (isHovered || isSelected || isActive) {
    const glow = ctx.createRadialGradient(n.x, n.y, n.r * 0.5, n.x, n.y, n.r * 2.2);
    glow.addColorStop(0, `rgba(${hexToRgb(n.color)},0.35)`);
    glow.addColorStop(1, `rgba(${hexToRgb(n.color)},0)`);
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
  }

  // shadow ring
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${hexToRgb(n.color)},0.18)`;
  ctx.fill();

  // gradient fill
  const grad = ctx.createRadialGradient(n.x - n.r*0.3, n.y - n.r*0.3, n.r*0.1, n.x, n.y, n.r);
  grad.addColorStop(0, lighten(n.color, 30));
  grad.addColorStop(1, darken(n.color, 40));
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // border
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
  ctx.strokeStyle = isSelected || isActive ? n.color : `rgba(${hexToRgb(n.color)},0.6)`;
  ctx.lineWidth = isSelected || isActive ? 3 : 1.5;
  ctx.stroke();

  // icon
  ctx.font = `${Math.round(n.r * 0.45)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(n.icon, n.x, n.y - n.r * 0.15);

  // label
  ctx.font = `600 ${Math.max(9, Math.round(n.r * 0.27))}px Inter, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText(n.name, n.x, n.y + n.r * 0.38);

  // file count badge
  const fc = Object.values(n.layers).reduce((a,b)=>a+b,0);
  if (fc > 0) {
    const bx = n.x + n.r * 0.72, by = n.y - n.r * 0.72;
    ctx.beginPath();
    ctx.arc(bx, by, 11, 0, Math.PI*2);
    ctx.fillStyle = '#0a0d14';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bx, by, 11, 0, Math.PI*2);
    ctx.strokeStyle = n.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.font = '600 9px Inter, sans-serif';
    ctx.fillStyle = n.color;
    ctx.fillText(fc, bx, by);
  }

  ctx.restore();
}

function lighten(hex, amt) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) {
  const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
  return `rgb(${r},${g},${b})`;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.scale, transform.scale);

  // grid dots
  ctx.globalAlpha = 0.07;
  for (let x = -transform.x/transform.scale % 40; x < W/transform.scale + 40; x += 40) {
    for (let y = -transform.y/transform.scale % 40; y < H/transform.scale + 40; y += 40) {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, Math.PI*2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  edges.forEach(drawEdge);
  nodes.forEach(drawNode);

  ctx.restore();
}

/* ═══════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════ */
let frame = 0;
function loop() {
  if (frame < 300) simulate();
  frame++;
  draw();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════
   INTERACTION
═══════════════════════════════════════ */
function toWorld(cx, cy) {
  return {
    x: (cx - transform.x) / transform.scale,
    y: (cy - transform.y) / transform.scale,
  };
}

function nodeAt(cx, cy) {
  const { x, y } = toWorld(cx, cy);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = n.x - x, dy = n.y - y;
    if (dx*dx + dy*dy < n.r * n.r) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n) {
    dragNode = n;
    dragStart = { x: e.offsetX, y: e.offsetY, nx: n.x, ny: n.y };
    n.fx = n.x; n.fy = n.y;
  } else {
    panStart = { x: e.offsetX - transform.x, y: e.offsetY - transform.y };
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragNode && dragStart) {
    const { x, y } = toWorld(e.offsetX, e.offsetY);
    dragNode.fx = x; dragNode.fy = y;
    dragNode.x = x; dragNode.y = y;
    return;
  }
  if (panStart) {
    transform.x = e.offsetX - panStart.x;
    transform.y = e.offsetY - panStart.y;
    return;
  }
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n !== hoveredNode) {
    hoveredNode = n;
    canvas.style.cursor = n ? 'pointer' : 'grab';
    if (n) showTooltip(e.offsetX, e.offsetY, n);
    else hideTooltip();
  } else if (n) {
    moveTooltip(e.offsetX, e.offsetY);
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragNode && !dragStart) return;
  if (dragNode) {
    dragNode.fx = null; dragNode.fy = null;
    dragNode = null;
  }
  panStart = null;

  const n = nodeAt(e.offsetX, e.offsetY);
  if (n) { selectNode(n); }
  else { deselectNode(); }
  dragStart = null;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const cx = e.offsetX, cy = e.offsetY;
  transform.x = cx - (cx - transform.x) * factor;
  transform.y = cy - (cy - transform.y) * factor;
  transform.scale *= factor;
  transform.scale = Math.max(0.2, Math.min(4, transform.scale));
}, { passive: false });

/* ─── Tooltip ─── */
const tooltip = document.getElementById('tooltip');
function showTooltip(x, y, n) {
  tooltip.style.display = 'block';
  tooltip.querySelector('strong').textContent = n.icon + ' ' + n.name;
  const fc = Object.values(n.layers).reduce((a,b)=>a+b,0);
  tooltip.querySelector('span').textContent = `${fc} files · ${n.deps.length} deps`;
  moveTooltip(x, y);
}
function moveTooltip(x, y) {
  tooltip.style.left = (x + 14) + 'px';
  tooltip.style.top  = (y - 10) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

/* ─── Select ─── */
function selectNode(n) {
  selectedNode = n;
  showInfoPanel(n);
}
function deselectNode() {
  selectedNode = null;
  document.getElementById('infoPanel').classList.remove('visible');
}

function showInfoPanel(n) {
  const panel = document.getElementById('infoPanel');
  document.getElementById('ipTitle').innerHTML =
    `<span style="color:${n.color}">${n.icon}</span> ${n.name}`;
  const fc = Object.values(n.layers).reduce((a,b)=>a+b,0);
  const epCount = n.endpoints.length;
  const rows = [
    ['Module ID', n.id],
    ['Total Files', fc],
    ['Controllers', n.layers.controller || 0],
    ['Services', (n.layers.service || 0) + (n.layers.impl || 0)],
    ['Repositories', n.layers.repository || 0],
    ['Entities', n.layers.entity || 0],
    ['Endpoints', epCount > 0 ? n.endpoints[0] + (epCount > 1 ? ` +${epCount-1}` : '') : '—'],
    ['Depends on', n.deps.length > 0 ? n.deps.join(', ') : 'none'],
    ['Key Entities', n.entities.slice(0,3).join(', ') || '—'],
  ];
  document.getElementById('ipBody').innerHTML = rows.map(([k,v]) =>
    `<div class="ip-row"><span class="ip-key">${k}</span><span class="ip-val">${v}</span></div>`
  ).join('');
  panel.classList.add('visible');
}
function closeInfo() { deselectNode(); }

/* ═══════════════════════════════════════
   SIDEBAR MODULE LIST
═══════════════════════════════════════ */
function buildSidebar() {
  const list = document.getElementById('moduleList');
  list.innerHTML = MODULES.map(m => {
    const fc = Object.values(m.layers).reduce((a,b)=>a+b,0);
    return `
    <div class="module-item" id="mi-${m.id}" onclick="toggleModule('${m.id}')">
      <div class="module-dot" style="background:${m.color}"></div>
      <span>${m.icon} ${m.name}</span>
      <span class="module-count">${fc}</span>
    </div>`;
  }).join('');
}

function toggleModule(id) {
  if (activeModule === id) {
    activeModule = null;
    document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
  } else {
    activeModule = id;
    document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
    document.getElementById('mi-' + id)?.classList.add('active');
    const n = nodes.find(n => n.id === id);
    if (n) selectNode(n);
  }
}

/* ═══════════════════════════════════════
   VIEW MODES
═══════════════════════════════════════ */
function setView(mode) {
  viewMode = mode;
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode)?.classList.add('active');

  if (mode === 'layers') {
    // arrange by layer type
    const layerPos = { controller: 0.15, service: 0.38, repository: 0.62, entity: 0.85 };
    nodes.forEach((n, i) => {
      n.fx = W * 0.1 + (i % 5) * W * 0.18;
      n.fy = H * 0.5;
      setTimeout(() => { n.fx = null; n.fy = null; }, 1200);
    });
    frame = 0;
  }
}

function zoom(f) {
  transform.x = W/2 - (W/2 - transform.x) * f;
  transform.y = H/2 - (H/2 - transform.y) * f;
  transform.scale = Math.max(0.2, Math.min(4, transform.scale * f));
}

function resetView() {
  transform = { x: 0, y: 0, scale: 1 };
  activeModule = null;
  selectedNode = null;
  document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
  document.getElementById('infoPanel').classList.remove('visible');
  buildNodes();
  frame = 0;
}

/* ═══════════════════════════════════════
   RESIZE & INIT
═══════════════════════════════════════ */
function resize() {
  const wrap = canvas.parentElement;
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}

window.addEventListener('resize', () => {
  resize();
  buildNodes();
  frame = 0;
});

resize();
buildNodes();
buildSidebar();
loop();
</script>
</body>
